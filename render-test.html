<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hailed render test</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;color:#cde;font:13px system-ui,sans-serif;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #ui{position:fixed;left:8px;top:8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:#0008;padding:6px;border-radius:6px}
  button{background:#123;color:#cde;border:1px solid #356;padding:3px 8px;border-radius:4px;cursor:pointer}
  button.on{background:#2a5a7a}
  #err{position:fixed;left:8px;bottom:8px;color:#f88;white-space:pre-wrap}
  .hide #ui{display:none}
</style></head><body>
<canvas id="c"></canvas><canvas id="m" style="display:none"></canvas>
<div id="ui"></div><div id="err"></div>
<script type="module">
import { createRenderer, ventCamera, cycloneCamera, surfaceVents } from './src/render/index.js';
import * as fx from './src/ui/mapfx.js';
const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const mc = document.getElementById('m');
const both = (ev, fn, o) => { canvas.addEventListener(ev, fn, o); mc.addEventListener(ev, fn, o); };
const ui = document.getElementById('ui');
let R;
try { R = createRenderer(canvas); } catch (e) { document.getElementById('err').textContent = 'Renderer failed: ' + e.message; throw e; }
if (q.has('hideui')) document.body.classList.add('hide');

const star = { id:'testsol', name:'Test Star', spectral:'G2V', pos:[0,0,0], color:[1,.86,.62], lum0:1, lum:1, infection:0, radius:1, planets:[
  { id:'p-lava', name:'Cinder', seed:1337, type:'lava', radius:.9, orbit:.4, phase:.3, periodDays:88,
    atmo:{color:[1,.45,.2],density:.45}, palette:[[.06,.045,.04],[.2,.1,.08],[1,.25,.03],[1,.6,.1],[1,.9,.5]], rings:null },
  { id:'p-desert', name:'Dune', seed:42, type:'desert', radius:1.1, orbit:.8, phase:1.6, periodDays:225,
    atmo:{color:[.9,.6,.4],density:.35}, palette:[[.55,.32,.15],[.75,.5,.25],[.85,.65,.4],[.6,.35,.2],[.3,.18,.1]], rings:null },
  { id:'p-earth', name:'Terra', seed:7, type:'ocean', radius:1, orbit:1, phase:3, periodDays:365, special:'earth',
    atmo:{color:[.35,.6,1],density:.7}, palette:[[.01,.06,.22],[.04,.3,.48],[.5,.45,.3],[.2,.4,.15],[.45,.4,.36]], rings:null },
  { id:'p-ocean', name:'Thalassa', seed:26, type:'ocean', radius:1.1, orbit:1.1, phase:3.6, periodDays:420,   // seed 26: both cyclones sit over open ocean
    atmo:{color:[.35,.6,1],density:.7}, palette:[[.01,.06,.22],[.04,.3,.48],[.5,.45,.3],[.2,.4,.15],[.45,.4,.36]], rings:null },
  { id:'p-rocky', name:'Basalt', seed:99, type:'rocky', radius:.8, orbit:1.5, phase:4.2, periodDays:600,
    atmo:{color:[.7,.6,.55],density:.3}, palette:[[.2,.18,.17],[.38,.33,.28],[.52,.47,.4],[.7,.66,.6],[.85,.82,.8]], rings:null },
  { id:'p-gas', name:'Jove', seed:2024, type:'gas', radius:11, orbit:5.2, phase:5.5, periodDays:4332,
    atmo:{color:[.9,.75,.55],density:.6}, palette:[[.78,.58,.4],[.92,.82,.62],[.58,.38,.28],[.96,.9,.8],[.72,.3,.2]],
    rings:{inner:1.5,outer:2.4,color:[.82,.72,.55],opacity:.85} },
  { id:'p-ice', name:'Rime', seed:555, type:'ice', radius:3.8, orbit:19, phase:2.2, periodDays:60000,
    atmo:{color:[.6,.8,1],density:.25}, palette:[[.82,.9,.98],[.04,.22,.6],[.6,.75,.92],[.9,.95,1],[1,1,1]],
    rings:{inner:1.4,outer:1.9,color:[.75,.82,.9],opacity:.5} },
  { id:'p-vrocky', name:'Ember', seed:101, type:'rocky', radius:.9, orbit:.6, phase:.9, periodDays:150,
    atmo:{color:[.7,.6,.55],density:.3}, palette:[[.2,.18,.17],[.38,.33,.28],[.52,.47,.4],[.7,.66,.6],[.85,.82,.8]], rings:null },
  { id:'p-erid', name:'Erid', seed:4040, type:'rocky', radius:1.7, orbit:.7, phase:2.4, periodDays:180, special:'erid',
    atmo:{color:[.7,.5,.3],density:.9}, palette:[[.2,.15,.1],[.4,.3,.2],[.55,.42,.28],[.7,.55,.4],[.85,.75,.6]], rings:null },
  { id:'p-adrian', name:'Adrian', seed:3131, type:'rocky', radius:1.3, orbit:1.2, phase:5, periodDays:420, special:'adrian',
    atmo:{color:[.55,.8,.55],density:.8}, palette:[[.14,.17,.1],[.3,.34,.2],[.45,.5,.3],[.6,.62,.42],[.8,.82,.7]], rings:null },
]};
const byType = { vrocky:'p-vrocky', rocky:'p-rocky', ocean:'p-ocean', earth:'p-earth', ice:'p-ice', lava:'p-lava', gas:'p-gas', desert:'p-desert', erid:'p-erid', adrian:'p-adrian' };
// ?blip=docked -> Blip-A joined to the Hail Mary by the tunnel; ?blip=away -> orbiting a planet (the viewed one in `ship`).
const blipOpt = (id) => !q.has('blip') ? undefined : q.get('blip') === 'docked' ? { docked: true }
  : { docked: false, planetId: id || byType[q.get('pl') || 'earth'] };
const views = ['system','petrova','star','rocky','vrocky','ocean','earth','ice','lava','gas','desert','erid','adrian','ship','shipsys','mapfx'];
const starTypes = { G2:[1,.86,.62], M:[1,.45,.2], A:[.7,.8,1], K:[1,.68,.38] };

let view = views.includes(q.get('view')) ? q.get('view') : 'system';
let infection = parseFloat(q.get('infection') ?? (view === 'petrova' ? '.6' : '0')) || 0;
if (q.get('star') && starTypes[q.get('star')]) star.color = starTypes[q.get('star')];
let selected = q.get('sel') || null;
const cams = {};
function cam() { return cams[view] ??= view === 'petrova' ? { yaw: parseFloat(q.get('yaw')??'0.5'), pitch: parseFloat(q.get('pitch')??'0.55'), dist: 0 } : view === 'star' ? { yaw: 0.3, pitch: 0.2, dist: parseFloat(q.get('dist')??'6') } : (view === 'system' || view === 'shipsys') ? { yaw: parseFloat(q.get('yaw')??'0.5'), pitch: parseFloat(q.get('pitch')??'0.55'), dist: 0 }
                                                          : { yaw: parseFloat(q.get('yaw')??'0.3'), pitch: parseFloat(q.get('pitch')??'0.25'), dist: parseFloat(q.get('dist')??'0') }; }
const speed0 = parseFloat(q.get('speed') ?? '1') || 1;
let fixedTime = q.has('t') ? parseFloat(q.get('t')) : null;
// age=<s>: put the chosen vent (vent=i) at that point of its eruption/geyser cycle (sets t), so a shot always catches the action
if (q.has('age') && q.has('vent')) { const pp0 = star.planets.find(p => p.id === byType[view]); const c0 = pp0 && surfaceVents(pp0); if (c0) { const i = +q.get('vent'), P = c0.p[i*2], o = c0.p[i*2+1]; fixedTime = ((parseFloat(q.get('age')) - o) % P + P) % P + P; } }
if ((q.has('vent') || q.has('cyc')) && fixedTime != null) { const pp = star.planets.find(p => p.id === byType[view]); const vc = q.has('cyc') ? cycloneCamera(pp, fixedTime, +q.get('cyc')) : ventCamera(pp, fixedTime, +q.get('vent')); if (vc) { cams[view] = { yaw: vc.yaw + parseFloat(q.get('yawoff') ?? '0'), pitch: vc.pitch + parseFloat(q.get('pitchoff') ?? '0'), dist: parseFloat(q.get('dist') ?? '2.2') }; } }

// UI
const btns = {};
for (const v of views) { const b = document.createElement('button'); b.textContent = v; b.onclick = () => { view = v; sync(); }; ui.append(b); btns[v] = b; }
const lab = document.createElement('label'); lab.textContent = ' infection ';
const sl = document.createElement('input'); sl.type = 'range'; sl.min = 0; sl.max = 1; sl.step = .01; sl.value = infection;
const val = document.createElement('span'); val.textContent = infection.toFixed(2);
sl.oninput = () => { infection = +sl.value; val.textContent = infection.toFixed(2); };
lab.append(sl, val); ui.append(lab);
const labS = document.createElement('label'); labS.textContent = ' time x';
const spd = document.createElement('input'); spd.type = 'range'; spd.min = 0; spd.max = 12; spd.step = .25; spd.value = speed0;
const spv = document.createElement('span'); spv.textContent = speed0.toFixed(2);
spd.oninput = () => { spv.textContent = (+spd.value).toFixed(2); };
labS.append(spd, spv); ui.append(labS);
const lab2 = document.createElement('label'); lab2.textContent = ' star ';
const ssel = document.createElement('select'); for (const k of Object.keys(starTypes)) { const o = document.createElement('option'); o.textContent = k; ssel.append(o); }
ssel.onchange = () => { star.color = starTypes[ssel.value]; }; lab2.append(ssel); ui.append(lab2);
const hint = document.createElement('span'); hint.textContent = ' drag = orbit, wheel = zoom, click planet = select. Eruptions: lava/vrocky; waves+cyclones+aurora: ocean/earth; geysers: ice; storms: gas; dust: desert; impacts: rocky; ship / shipsys: Hail Mary. URL params: vent=i age=s (catch a vent at a point of its cycle) pitchoff yawoff cyc=j (cyclone camera) lit=deg (star angle off the camera) flash=1 (hold lightning on) t=s speed=x infection=0..1; blip=docked|away (Rocky's ship in system/ship views); ship: pl=type burn=1 harvest=0..1 follow=1 fdist fyaw fpitch sphase; shipsys: mode=orbit|park|transfer pl from to prog burn harvest'; ui.append(hint);
function sync() { for (const v of views) btns[v].classList.toggle('on', v === view); canvas.style.display = view === 'mapfx' ? 'none' : 'block'; mc.style.display = view === 'mapfx' ? 'block' : 'none'; if (view === 'mapfx') mc.style.zIndex = 0; }
sync();

// camera input
let drag = null, moved = 0;
both('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; moved = 0; e.target.setPointerCapture(e.pointerId); });
both('pointermove', e => {
  if (!drag) return;
  const c = cam(); moved += Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y);
  c.yaw -= (e.clientX - drag.x) * .006; c.pitch = Math.max(-1.4, Math.min(1.4, c.pitch + (e.clientY - drag.y) * .006));
  drag = { x: e.clientX, y: e.clientY };
});
both('pointerup', e => {
  if (moved < 4 && (view === 'system' || view === 'star')) selected = R.pick(e.clientX, e.clientY);
  drag = null;
});
both('wheel', e => {
  e.preventDefault(); const c = cam();
  if (!c.dist) c.dist = view === 'system' ? R.fitDist(star) : 3.4;
  c.dist *= Math.exp(e.deltaY * .001);
}, { passive: false });
addEventListener('resize', () => R.resize());
// ---- map-fx preview (2D canvas) ----
const mstars = [['Sol',[0,0,0],[1,.86,.62],1,0],['Tau Ceti',[3.2,.8,-10.5],[1,.78,.5],.5,.7],['40 Eridani',[-9,-3,-12],[1,.68,.4],.4,.3],
  ['Sirius A',[-4,5,-8],[.72,.82,1],25,.0],['Procyon A',[10,2,-9],[1,.95,.85],7,.2],['Barnard',[-2,-6,3],[1,.4,.2],.01,.9],['Wolf 359',[6,-4,5],[1,.35,.18],.002,.6],
  ['Alpha Cen A',[-3,-1,-4],[1,.9,.7],1.5,.5],['Ross 128',[8,6,9],[1,.45,.25],.004,.1],['61 Cyg',[-8,2,6],[1,.6,.3],.15,.4]].map(([name,pos,color,lum,infection],i)=>({id:'m'+i,name,pos,color,lum,infection,spectral:'?'}));
function mapFrame(t) {
  const dpr = Math.min(devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
  if (mc.width !== W * dpr || mc.height !== H * dpr) { mc.width = W * dpr; mc.height = H * dpr; }
  mc.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;display:block';
  const g = mc.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const c = cam(); const yaw = c.yaw, pitch = c.pitch, R = 14;
  const project = (p) => { const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const x1 = p[0]*cy - p[2]*sy, z1 = p[0]*sy + p[2]*cy, y1 = p[1]*cp - z1*sp, z2 = p[1]*sp + z1*cp;
    const camD = R*3.2, f = camD/(camD - z2), sc = (Math.min(W,H)*.42/R)*f; return { x: W/2 + x1*sc, y: H/2 + 30 - y1*sc, f, z: z2 }; };
  const items = mstars.map((s, i) => { s.infection = i === 0 ? infection : Math.min(1, (s.id === 'm1' ? 1 : .6) * infection);
    const p = project(s.pos), b = project([s.pos[0], 0, s.pos[2]]);
    return { x: p.x, y: p.y, depth: p.z, f: p.f, bx: b.x, by: b.y, star: s, isShip: i === 1, selected: i === 3, hovered: i === 4, tag: i === 0 ? 'Earth · target' : i === 2 ? 'Erid · target' : undefined }; });
  const links = [[0,7],[0,1],[1,2],[0,9],[1,5]].map(([a,b]) => ({ a: items[a], b: items[b], strength: Math.min(items[a].star.infection, items[b].star.infection) }));
  g.clearRect(0, 0, W, H);
  fx.drawMapFrame(g, W, H, t, { cam: c, gridProject: project, gridR: R, stars: items, links: links.filter(l => l.strength > .05), route: undefined });
}

let tAcc = 0, tPrev = performance.now();
function frame() {
  const now = performance.now(); tAcc += (now - tPrev) / 1000 * (+spd.value); tPrev = now;
  const t = fixedTime ?? tAcc;
  star.infection = infection; star.lum = 1 - .4 * infection;
  const c = cam();
  if (q.has('lit') && byType[view]) { const pp = star.planets.find(p => p.id === byType[view]); if (pp) { const cp = Math.cos(c.pitch); pp.phase = Math.atan2(cp * Math.cos(c.yaw), cp * Math.sin(c.yaw)) - .8 + (+q.get('lit')) * Math.PI / 180; } }   // lit=<deg>: angle of the star from the camera direction
  if (view === 'mapfx') { mapFrame(t); }
  else if (view === 'system' || view === 'petrova' || view === 'star') R.renderSystem(star, t, c, { selectedId: selected, showOrbits: true, blip: blipOpt(),
    ship: q.get('blip') === 'docked' ? { orbitPlanetId: byType[q.get('pl') || 'earth'] } : undefined });
  else if (view === 'ship') {   // ship close-up around a planet: pl=<type> burn=1 harvest=<0..1> follow=1 [fyaw fpitch fdist] sphase=<rad> sscale=<s> blip=docked|away
    const pl = star.planets.find(p => p.id === byType[q.get('pl') || 'adrian']);
    R.renderPlanet(pl, star, t, c, { ship: { phase: q.has('sphase') ? +q.get('sphase') : t * .35, burning: q.has('burn'), scale: q.has('sscale') ? +q.get('sscale') : undefined },
      harvest: q.has('harvest') ? { progress: +q.get('harvest') || .6 } : undefined,
      blip: blipOpt(pl.id),
      follow: q.has('follow') ? { yaw: +(q.get('fyaw') || 0), pitch: +(q.get('fpitch') || 0), dist: +(q.get('fdist') || .9) } : undefined });
  } else if (view === 'shipsys') {   // ship in the system view: mode=orbit|park|transfer pl=<type> prog=<0..1> burn=1 harvest=1
    const mode = q.get('mode') || 'orbit', ship = { burning: q.has('burn') };
    if (mode === 'orbit') ship.orbitPlanetId = byType[q.get('pl') || 'earth'];
    else if (mode === 'park') ship.parkAu = +(q.get('au') || 3);
    else ship.transfer = { fromId: byType[q.get('from') || 'earth'], toId: byType[q.get('to') || 'rocky'], progress: q.has('prog') ? +q.get('prog') : (t * .04) % 1 };
    R.renderSystem(star, t, c, { selectedId: selected, showOrbits: true, ship, blip: blipOpt(), harvest: q.has('harvest') ? { boost: 1 } : undefined });
  }
  else R.renderPlanet(star.planets.find(p => p.id === byType[view]), star, t, c);
  window.__frames = (window.__frames || 0) + 1;
  requestAnimationFrame(frame);
}
frame();
</script></body></html>
